name: LeadForge validation

on:
  push:
    paths:
      - 'leadforge/**'
      - '.github/workflows/leadforge-test.yml'
  pull_request:
    paths:
      - 'leadforge/**'
      - '.github/workflows/leadforge-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leadforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build example demo
        run: node bin/build-demo.js leads/example.json /tmp/leadforge-demo/index.html
